<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Engineer — voxel engine sandbox</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:#8a8a8a;--accent:#22a7d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:12px "Courier New",monospace;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
#canvasWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#canvasBox{position:relative;flex:none}
canvas#c{display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
canvas#ov{position:absolute;left:0;top:0;pointer-events:none}
#fps{position:absolute;left:8px;top:6px;color:var(--accent);font-size:13px;pointer-events:none;z-index:2}
#info{position:absolute;right:6px;top:6px;text-align:right;color:#ccc;font-size:12px;pointer-events:none;line-height:1.4;z-index:2}
#side{width:104px;display:flex;flex-direction:column;padding:4px 2px;font:12px Arial,sans-serif;overflow-y:auto;scrollbar-width:none;flex:none}
#side::-webkit-scrollbar{display:none}
.grp{display:flex;flex-direction:column;gap:2px}
.sb{display:flex;align-items:center;gap:5px;cursor:pointer;height:26px;flex:none}
.sb i{width:26px;height:24px;border:1px solid var(--fg);display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.sb.on i{background:var(--fg);color:var(--bg)}
.sb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg{display:block}
#top{display:flex;gap:2px;padding:2px 4px;height:32px;flex:none;align-items:center}#top .b{height:28px}#top .b.on{background:var(--fg);color:var(--bg)}
#grid{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px)}
#strip{display:flex;gap:2px;overflow-x:auto;padding:0 4px;height:30px;align-items:center;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:none}
#strip::-webkit-scrollbar{display:none}
.el{flex:none;min-width:46px;height:24px;padding:0 6px;display:grid;place-items:center;font-size:13px;font-weight:bold;color:#fff;cursor:pointer;border:2px solid transparent;white-space:nowrap}
.el.L{border-color:#f00}.el.R{border-color:#36f}
.el.tool{background:#1a1e27;color:#d8dce2}
.el.tool.on{background:var(--fg);color:var(--bg)}
.empty{color:var(--dim);font-size:12px;padding-left:4px}
#bar{display:flex;gap:2px;padding:0 4px 2px;height:30px;flex:none}
.b{border:1px solid var(--fg);display:flex;align-items:center;padding:0 6px;white-space:nowrap;font-size:11px;overflow:hidden;cursor:pointer;background:transparent;color:var(--fg)}
.b.sq{width:28px;justify-content:center;padding:0}
.b.grow{flex:1;min-width:0}
#pause{background:var(--fg);color:var(--bg)}
#bar .b.on{background:var(--fg);color:var(--bg)}
#br{width:34px;justify-content:center}
@media(max-width:560px){#side{width:38px}.sb span{display:none}.sb i{width:30px;height:24px}
#info{top:auto;bottom:6px;left:8px;right:auto;text-align:left}}
</style>
</head>
<body>
<div id="app">
 <div id="top"></div>
 <div id="main">
  <div id="stage">
   <div id="canvasWrap"><div id="canvasBox"><canvas id="c"></canvas><canvas id="ov"></canvas><div id="grid"></div></div></div>
   <div id="fps">FPS: 60.00 Parts: 0</div>
   <div id="info">&nbsp;</div>
  </div>
  <div id="side"><div class="grp" id="g2"></div></div>
 </div>
 <div id="strip"></div>
 <div id="bar"></div>
</div>
<script src="js/materials.js?v=8"></script>
<script src="js/sim.js?v=8"></script>
<script src="js/main.js?v=8"></script>
</body>
</html>
